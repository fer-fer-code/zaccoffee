<body class="home">
  <!-- The client's film, from the coffee tree to the cup (tools/build_film.sh, 68 s, its own music), full screen over
       the start screen. Starts muted (browsers require it), "Sound on" and "Skip intro" are always visible; when it
       ends it fades out over the start screen.
       Nothing downloads until home.js decides to show it (the sources only have data-src). Each browser takes the
       first file it can play: phones in portrait the 1080x1920 cut (HEVC for iPhone, else H.264); others AV1 (Chrome,
       Firefox, Edge), HEVC (Safari), H.264 (older browsers). -->
  <div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="ZACCOFFEE film" data-mode="every">
    <div class="intro__frame">
      <video class="intro__film" muted playsinline preload="none"
             aria-hidden="true" tabindex="-1" disablepictureinpicture disableremoteplayback>
        <source data-src="assets/video/film-portrait-hevc.mp4?v=20261103c" type='video/mp4; codecs="hvc1.2.4.L123.B0, mp4a.40.2"' media="(orientation: portrait)">
        <source data-src="assets/video/film-portrait.mp4?v=20261103c" type='video/mp4; codecs="avc1.640029, mp4a.40.2"' media="(orientation: portrait)">
        <source data-src="assets/video/film-av1.mp4?v=20261103c" type='video/mp4; codecs="av01.0.08M.10, mp4a.40.2"'>
        <source data-src="assets/video/film-hevc.mp4?v=20261103c" type='video/mp4; codecs="hvc1.2.4.L123.B0, mp4a.40.2"'>
        <source data-src="assets/video/film.mp4?v=20261103c" type='video/mp4; codecs="avc1.64001f, mp4a.40.2"'>
      </video>
    </div>
    <div class="intro__ui">
      <button class="btn btn--ghost btn--small intro__sound" type="button" aria-pressed="false">
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5h4l5-4v13l-5-4H3z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg><svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5h4l5-4v13l-5-4H3z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span class="btn__label">Sound on</span>
      </button>
      <button class="btn btn--ghost btn--small intro__skip" type="button">Skip intro<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="intro__bar" aria-hidden="true"><span></span></div>
  </div>
